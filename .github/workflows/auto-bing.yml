name: Auto Update Bing Images CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [ main, gh-pages ]
  pull_request:
    branches: [ gh-pages ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate images.js
        run: |
          node assets/js/bing.js

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          add: 'assets/json/images.js'
          message: "Update Bing images"
          # 不显式传 token，使用仓库内置 GITHUB_TOKEN（permissions: contents: write 已授权），
          # 避免因 GH_TOKEN secret 未配置而出现 "No github_token has been detected" 警告

      # 未配置 Cloudflare 凭据时跳过（避免产生失败记录），配置后自动生效
      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare 凭据已配置，将同步到 wencker.pro"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过 Cloudflare Pages 部署"
          fi

      # wencker.pro 由 Cloudflare Pages（Direct Upload）承载，不与 Git 联动，
      # 因此每次更新壁纸后需主动推一次，否则 .pro 上的壁纸会停在旧快照。
      # 本步骤是唯一的部署入口（原 deploy-cf.yml 已合并到这里：用 GITHUB_TOKEN 推送的
      # 提交不会触发新的 workflow，那个文件对机器人提交永远不生效）。
      # continue-on-error：部署失败不应连累壁纸提交，只留一条 warning 注解。
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.ready == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        run: npx --yes wrangler@3 pages deploy . --project-name wencker-home --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 部署失败时把原因摆到 workflow 注解里，避免"绿了但其实没发出去"
      - name: Warn on deploy failure
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning title=Cloudflare Pages 部署失败::壁纸已提交到 main，但 wencker.pro 未更新。请检查 secret CLOUDFLARE_API_TOKEN；Cloudflare 报 Authentication error 10000 表示 token 已失效或权限不足。"
